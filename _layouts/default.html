<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    <script>
      (function () {
        var button = document.getElementById("theme-toggle");
        if (!button) return;

        function setTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("theme", theme);
          document.getElementById("theme-icon-sun").classList.toggle("active", theme === "dark");
          document.getElementById("theme-icon-moon").classList.toggle("active", theme === "light");
          button.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
          if (window.__mermaid) {
            document.querySelectorAll('.mermaid').forEach(function(el) {
              var src = el.getAttribute('data-source');
              if (src) { el.innerHTML = src; el.removeAttribute('data-processed'); }
            });
            window.__mermaid.initialize({ startOnLoad: false, theme: theme === 'dark' ? 'dark' : 'default' });
            window.__mermaid.run({ querySelector: '.mermaid' });
          }
        }

        var current = document.documentElement.getAttribute("data-theme") || "light";
        setTheme(current);

        button.addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          setTheme(next);
        });
      })();
    </script>

  </body>

</html>
