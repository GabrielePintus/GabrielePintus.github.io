---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {%- if page.status %}<span>{{ page.status }}</span>{%- endif %}
      {%- if page.tags and page.tags.size > 0 %}
        &nbsp;·&nbsp;
        {%- for tag in page.tags %}<code>{{ tag }}</code> {% endfor %}
      {%- endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
